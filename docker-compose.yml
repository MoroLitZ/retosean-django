# Entorno completo de desarrollo: `docker compose up`
#   - web:     Django en http://localhost:8000 (recarga al editar el codigo)
#   - db:      PostgreSQL 18 (expuesto en 127.0.0.1:5433 para no chocar con uno local)
#   - mailpit: bandeja de correo de pruebas en http://localhost:8025
# CFG-07: sin secretos por defecto (SECRET_KEY y DB_PASSWORD se toman del .env y
# es obligatorio definirlos) y la BD/correo solo se publican en el loopback.
# Migraciones: docker compose exec web python manage.py migrate
# Datos de prueba: docker compose exec web python manage.py sembrar_demo_completa

services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: retosean_django
      POSTGRES_USER: retosean
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Definir DB_PASSWORD en el .env}
    volumes:
      - pgdata:/var/lib/postgresql
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U retosean -d retosean_django"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit
    ports:
      - "127.0.0.1:8025:8025"

  web:
    build: .
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.development
      SECRET_KEY: ${SECRET_KEY:?Definir SECRET_KEY en el .env}
      DEBUG: "True"
      ALLOWED_HOSTS: localhost,127.0.0.1,0.0.0.0
      SITE_URL: http://localhost:8000
      DB_NAME: retosean_django
      DB_USER: retosean
      DB_PASSWORD: ${DB_PASSWORD:?Definir DB_PASSWORD en el .env}
      DB_HOST: db
      DB_PORT: "5432"
      EMAIL_BACKEND: django.core.mail.backends.smtp.EmailBackend
      EMAIL_HOST: mailpit
      EMAIL_PORT: "1025"
      EMAIL_USE_TLS: "False"
    volumes:
      - .:/app
      - media:/app/media
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started

volumes:
  pgdata:
  media:
