# Entorno completo de desarrollo: `docker compose up`
#   - web:     Django en http://localhost:8000 (recarga al editar el codigo)
#   - db:      PostgreSQL 18 (expuesto en el puerto 5433 para no chocar con uno local)
#   - mailpit: bandeja de correo de pruebas en http://localhost:8025
# Datos de prueba: docker compose exec web python manage.py sembrar_demo_completa

services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: retosean_django
      POSTGRES_USER: retosean
      POSTGRES_PASSWORD: ${DOCKER_DB_PASSWORD:-retosean-docker}
    volumes:
      - pgdata:/var/lib/postgresql
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U retosean -d retosean_django"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit
    ports:
      - "8025:8025"

  web:
    build: .
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.development
      SECRET_KEY: ${DOCKER_SECRET_KEY:-docker-dev-only-not-a-secret}
      DEBUG: "True"
      ALLOWED_HOSTS: localhost,127.0.0.1,0.0.0.0
      SITE_URL: http://localhost:8000
      DB_NAME: retosean_django
      DB_USER: retosean
      DB_PASSWORD: ${DOCKER_DB_PASSWORD:-retosean-docker}
      DB_HOST: db
      DB_PORT: "5432"
      EMAIL_BACKEND: django.core.mail.backends.smtp.EmailBackend
      EMAIL_HOST: mailpit
      EMAIL_PORT: "1025"
      EMAIL_USE_TLS: "False"
    volumes:
      - .:/app
      - media:/app/media
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started

volumes:
  pgdata:
  media:
