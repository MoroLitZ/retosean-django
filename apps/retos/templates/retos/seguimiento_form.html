{% extends 'base.html' %}

{% block content %}
<div class="container mt-4">
  <h1 class="h3">Registrar seguimiento</h1>
  <p class="text-muted">{{ reto }}</p>
  <form method="post" enctype="multipart/form-data" class="row g-3">
    {% csrf_token %}
    {% for field in form %}
    <div class="col-md-{% if field.name == 'avances' or field.name == 'observaciones' or field.name == 'acuerdos' or field.name == 'archivos' %}12{% else %}4{% endif %}">
      <label class="form-label">{{ field.label }}</label>
      {{ field }}
      {% if field.help_text %}<div class="form-text">{{ field.help_text }}</div>{% endif %}
      {% for error in field.errors %}<div class="text-danger small">{{ error }}</div>{% endfor %}
    </div>
    {% endfor %}
    <div class="col-12">
      <button class="btn btn-primary">Guardar seguimiento</button>
      <a href="{% url 'retos:seguimientos' reto.pk %}" class="btn btn-outline-secondary">Cancelar</a>
    </div>
  </form>
</div>
{% endblock %}
