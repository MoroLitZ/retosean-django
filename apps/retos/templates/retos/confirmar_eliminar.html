{% extends 'base.html' %}

{% block content %}
<div class="container mt-4">
  <h1 class="h3">Eliminar reto</h1>
  <p>Vas a eliminar <strong>{{ reto }}</strong>. Esta accion no se puede deshacer.</p>
  <form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Eliminar</button>
    <a href="{% url 'retos:detalle' reto.pk %}" class="btn btn-outline-secondary">Cancelar</a>
  </form>
</div>
{% endblock %}
