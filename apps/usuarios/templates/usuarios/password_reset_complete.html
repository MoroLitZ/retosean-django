{% extends 'base_auth.html' %}
{% block title %}Contraseña restablecida{% endblock %}

{% block content %}
<div class="auth-card" style="max-width: 480px;">
  <div class="p-4 p-md-5 text-center">
    <div class="mb-4" style="font-size: 3.5rem; color: var(--ean-green);">
      <i class="bi bi-check-circle"></i>
    </div>
    <h2 class="fw-bold mb-2" style="color:#111827;">Contraseña restablecida</h2>
    <p class="text-muted" style="font-size:0.9rem;">
      Tu contraseña fue actualizada correctamente. Ya puedes ingresar con ella.
    </p>
    <a href="{% url 'usuarios:login' %}" class="btn btn-auth mt-2">
      <i class="bi bi-box-arrow-in-right me-1"></i>Iniciar sesión
    </a>
  </div>
</div>
{% endblock %}
