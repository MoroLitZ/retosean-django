{% extends 'base_auth.html' %}
{% block title %}Correo enviado{% endblock %}

{% block content %}
<div class="auth-card" style="max-width: 480px;">
  <div class="p-4 p-md-5 text-center">
    <div class="mb-4" style="font-size: 3.5rem; color: var(--ean-green);">
      <i class="bi bi-envelope-check"></i>
    </div>
    <h2 class="fw-bold mb-2" style="color:#111827;">Revisa tu correo</h2>
    <p class="text-muted" style="font-size:0.9rem;">
      Si existe una cuenta asociada a ese correo, te enviamos un enlace para
      restablecer tu contraseña. Revisa también la carpeta de spam.
    </p>
    <a href="{% url 'usuarios:login' %}" class="btn btn-auth mt-2">
      <i class="bi bi-arrow-left me-1"></i>Volver a iniciar sesión
    </a>
  </div>
</div>
{% endblock %}
