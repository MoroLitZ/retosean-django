{% extends 'base.html' %}
{% block title %}Contraseña Cambiada{% endblock %}
{% block page_title %}Contraseña Actualizada{% endblock %}

{% block content %}
<div class="container-fluid px-0" style="max-width: 600px;">
  <div class="card-panel">
    <div class="p-5 text-center">
      <div class="mx-auto mb-3 d-flex align-items-center justify-content-center"
           style="width: 70px; height: 70px; border-radius: 50%; background: var(--accent-light); color: var(--accent); font-size: 2rem;">
        <i class="bi bi-check-circle-fill"></i>
      </div>
      <h5 style="font-weight: 800; color: #111827;">¡Tu contraseña fue cambiada correctamente!</h5>
      <p class="text-muted mb-4" style="font-size: 0.9rem;">A partir de ahora usa tu nueva contraseña para iniciar sesión.</p>
      <a href="{% url 'usuarios:perfil' %}" class="btn" style="background: var(--accent); color: #fff; border: none;">
        <i class="bi bi-person me-1"></i> Volver a mi perfil
      </a>
    </div>
  </div>
</div>
{% endblock %}
