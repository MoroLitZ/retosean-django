<!doctype html>
<html lang="es">
<body style="margin:0;padding:24px;background:#f3f4f6;font-family:Segoe UI,Arial,sans-serif;color:#111827;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px;margin:0 auto;background:#ffffff;border-radius:10px;overflow:hidden;">
    <tr>
      <td style="background:#111827;padding:18px 24px;color:#ffffff;font-size:18px;font-weight:700;">
        retos<span style="color:#f59e0b;">ean</span>
      </td>
    </tr>
    <tr>
      <td style="padding:24px;">
        <p style="margin:0 0 12px;font-size:15px;">
          Hola {{ usuario.get_full_name|default:usuario.username }},
        </p>
        <h2 style="margin:0 0 12px;font-size:18px;color:#111827;">{{ notificacion.titulo }}</h2>
        <p style="margin:0 0 20px;font-size:14px;line-height:1.6;color:#4b5563;">
          {{ notificacion.mensaje|linebreaksbr }}
        </p>
        {% if url_absoluta %}
          <a href="{{ url_absoluta }}"
             style="display:inline-block;background:#2563eb;color:#ffffff;text-decoration:none;padding:10px 18px;border-radius:6px;font-size:14px;font-weight:600;">
            Ver en la plataforma
          </a>
        {% endif %}
      </td>
    </tr>
    <tr>
      <td style="padding:16px 24px;background:#f9fafb;font-size:12px;color:#6b7280;">
        RetosEAN &middot; Universidad EAN. Puedes ajustar que avisos recibes desde tu perfil de notificaciones.
      </td>
    </tr>
  </table>
</body>
</html>
