{# Tarjeta de indicador. Espera: etiqueta, valor, icono, color, (opcional) nota #}
<div class="col-6 col-lg-3">
  <div class="card border-0 shadow-sm h-100">
    <div class="card-body d-flex align-items-center gap-3">
      <div class="rounded-3 d-flex align-items-center justify-content-center flex-shrink-0"
           style="width:46px;height:46px;background:{{ color|default:'#2563eb' }}1a;">
        <i class="bi bi-{{ icono|default:'graph-up' }}" style="color:{{ color|default:'#2563eb' }};font-size:1.25rem;"></i>
      </div>
      <div class="min-w-0">
        <div class="text-muted text-uppercase fw-bold" style="font-size:.68rem;letter-spacing:.03em;">
          {{ etiqueta }}
        </div>
        <div class="fw-bold text-dark" style="font-size:1.5rem;line-height:1.2;">
          {{ valor|default:"0" }}
        </div>
        {% if nota %}<div class="text-muted" style="font-size:.72rem;">{{ nota }}</div>{% endif %}
      </div>
    </div>
  </div>
</div>
