name: Rust

on:
  push:
    paths: ["rust/**", ".github/workflows/rust.yml"]
  pull_request:
    paths: ["rust/**", ".github/workflows/rust.yml"]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: retosean
          POSTGRES_PASSWORD: retosean-ci
          POSTGRES_DB: retosean_rust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U retosean"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # Each test creates and drops its own schema inside this database.
    env:
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_USER: retosean
      DB_PASSWORD: retosean-ci
      RUST_DB_NAME: retosean_rust

    defaults:
      run:
        working-directory: rust

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Formato
        run: cargo fmt --check

      # CFG-09: quality gate equivalent to quality.yml's ruff/bandit.
      # It runs as warnings (not -D warnings) because some pre-existing files
      # still have clippy warnings to clean up.
      - name: Clippy (lint)
        run: cargo clippy --locked --all-targets -- -W clippy::all

      - name: Instalar cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      # CFG-09: dependency audit gate (pip-audit equivalent). RUSTSEC-2023-0071
      # (rsa) is ignored: no fixed version exists and rsa is an optional sqlx
      # dependency that this feature set never builds.
      - name: Auditoría de dependencias
        run: cargo audit --ignore RUSTSEC-2023-0071

      - name: Sintaxis del frontend
        run: for f in web/js/*.js; do node --check "$f"; done

      - name: Pruebas (unitarias, extremo a extremo y paridad con Django)
        run: cargo test --locked -- --include-ignored
