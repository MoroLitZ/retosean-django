<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Retosean{% endblock %} — Universidad EAN</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@700;800;900&family=Open+Sans:ital,wght@0,300;0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <style>
    /* ── Paleta EAN ── */
    :root {
      --ean-green:     #3bac52;
      --ean-green-dk:  #2d8a40;
      --ean-green-lt:  rgba(59, 172, 82, 0.12);
      --ean-black:     #0a0a0a;
      --ean-black-2:   #141414;
    }

    body {
      min-height: 100vh;
      /* Fondo negro institucional — logo versión negativa */
      background: linear-gradient(145deg, #0a0a0a 0%, #111111 60%, #0d150d 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Open Sans', system-ui, -apple-system, sans-serif;
      padding: 1.5rem;
    }

    /* ── Tarjeta principal ── */
    .auth-card {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 28px 72px rgba(0, 0, 0, 0.55);
      overflow: hidden;
      width: 100%;
      max-width: 920px;
    }

    /* ── Panel izquierdo (negro + verde EAN) ── */
    .auth-panel-left {
      background: #0a0a0a;
      padding: 3rem 2.5rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 520px;
      position: relative;
      overflow: hidden;
    }
    /* Acento verde decorativo en esquina superior */
    .auth-panel-left::before {
      content: '';
      position: absolute;
      top: -60px; right: -60px;
      width: 200px; height: 200px;
      border-radius: 50%;
      background: rgba(59, 172, 82, 0.08);
      pointer-events: none;
    }
    .auth-panel-left::after {
      content: '';
      position: absolute;
      bottom: -80px; left: -40px;
      width: 240px; height: 240px;
      border-radius: 50%;
      background: rgba(59, 172, 82, 0.05);
      pointer-events: none;
    }

    /* ── Logo / marca ── */
    .brand-logo-auth {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      position: relative;
      z-index: 1;
    }
    /* Grid de puntos (identidad visual EAN) */
    .brand-dots-auth {
      display: grid;
      grid-template-columns: repeat(3, 6px);
      gap: 3px;
      flex-shrink: 0;
    }
    .brand-dots-auth span {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--ean-green);
    }
    .brand-dots-auth span:nth-child(2),
    .brand-dots-auth span:nth-child(6) {
      background: rgba(255,255,255,0.2);
    }
    .brand-wordmark-auth {
      font-family: 'Poppins', 'Montserrat', sans-serif;
      font-weight: 900;
      font-size: 1.7rem;
      letter-spacing: -0.5px;
      line-height: 1;
    }
    .brand-wordmark-auth .brand-retos { color: #fff; }
    .brand-wordmark-auth .brand-ean   { color: var(--ean-green); }

    .brand-sub-auth {
      font-size: 0.68rem;
      color: rgba(255,255,255,0.3);
      letter-spacing: 1.2px;
      text-transform: uppercase;
      font-weight: 300;
      margin-top: 0.35rem;
    }

    /* ── Features list (panel izquierdo) ── */
    .auth-feature-item {
      display: flex;
      align-items: flex-start;
      gap: 0.9rem;
      margin-bottom: 1.15rem;
      position: relative;
      z-index: 1;
    }
    .auth-feature-icon {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.05rem;
      flex-shrink: 0;
    }
    .auth-feature-title {
      color: #fff;
      font-weight: 600;
      font-size: 0.855rem;
      line-height: 1.25;
    }
    .auth-feature-sub {
      color: rgba(255, 255, 255, 0.42);
      font-size: 0.75rem;
      font-weight: 300;
    }

    /* Línea verde decorativa */
    .auth-divider {
      width: 36px;
      height: 3px;
      background: var(--ean-green);
      border-radius: 2px;
      margin: 1.5rem 0;
      position: relative;
      z-index: 1;
    }

    /* ── Panel derecho (formulario) ── */
    .auth-panel-right {
      padding: 3rem 2.5rem;
      background: #fff;
    }
    .auth-panel-right h2 {
      font-family: 'Poppins', 'Montserrat', sans-serif;
      font-weight: 800;
      font-size: 1.5rem;
      color: var(--ean-black);
      margin-bottom: 0.3rem;
    }
    .auth-panel-right .auth-subtitle {
      font-size: 0.845rem;
      color: #6b7280;
      font-weight: 300;
      margin-bottom: 1.8rem;
    }

    /* ── Inputs ── */
    .form-label {
      font-weight: 600;
      font-size: 0.8rem;
      color: #374151;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      margin-bottom: 0.3rem;
    }
    .form-control, .form-select {
      border-radius: 8px;
      padding: 0.65rem 0.9rem;
      border: 1.5px solid #d1d5db;
      font-size: 0.9rem;
      font-family: 'Open Sans', sans-serif;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .form-control:focus, .form-select:focus {
      border-color: var(--ean-green);
      box-shadow: 0 0 0 3px rgba(59, 172, 82, 0.12);
      outline: none;
    }
    .input-group-text {
      background: #f9fafb;
      border: 1.5px solid #d1d5db;
      border-right: none;
      color: #6b7280;
    }
    .input-group .form-control {
      border-left: none;
    }
    .input-group .form-control:focus {
      border-left: none;
      box-shadow: 0 0 0 3px rgba(59, 172, 82, 0.12);
    }

    /* ── Botón primario EAN ── */
    .btn-auth {
      background: var(--ean-green);
      border: none;
      border-radius: 8px;
      padding: 0.72rem 1.5rem;
      font-weight: 700;
      font-size: 0.9rem;
      letter-spacing: 0.2px;
      color: #fff;
      font-family: 'Open Sans', sans-serif;
      transition: background 0.18s, transform 0.12s;
    }
    .btn-auth:hover {
      background: var(--ean-green-dk);
      transform: translateY(-1px);
      color: #fff;
    }

    /* ── Links ── */
    .text-link-green {
      color: var(--ean-green);
      font-weight: 600;
      text-decoration: none;
    }
    .text-link-green:hover {
      color: var(--ean-green-dk);
      text-decoration: underline;
    }

    /* ── Badge de universidad ── */
    .auth-university-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.72rem;
      color: rgba(255,255,255,0.38);
      font-weight: 300;
      position: relative;
      z-index: 1;
    }
    .auth-university-badge .dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--ean-green);
      display: inline-block;
    }

    @media (max-width: 767px) {
      .auth-panel-left { display: none; }
      .auth-panel-right { padding: 2rem 1.5rem; }
    }
  </style>
  {% block extra_css %}{% endblock %}
</head>
<body>
  {% block content %}{% endblock %}
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  {% block extra_js %}{% endblock %}
</body>
</html>
