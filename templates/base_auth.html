<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}RetosEAN{% endblock %} — Universidad EAN</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <style>
    :root {
      --navy: #1e3a5f;
      --navy-dark: #162d4a;
      --orange: #e87722;
    }
    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #1e3a5f 0%, #0d1b2a 55%, #1a1a2e 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      padding: 1.5rem;
    }
    .auth-card {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 24px 64px rgba(0, 0, 0, 0.35);
      overflow: hidden;
      width: 100%;
      max-width: 900px;
    }
    .auth-panel-left {
      background: linear-gradient(160deg, #1e3a5f 0%, #0d1b2a 100%);
      padding: 3rem 2.5rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 500px;
    }
    .auth-panel-right {
      padding: 3rem 2.5rem;
    }
    .brand-logo {
      font-size: 1.6rem;
      font-weight: 800;
      letter-spacing: -0.5px;
    }
    .brand-logo .brand-retos { color: var(--orange); }
    .brand-logo .brand-ean  { color: #fff; }
    .form-label {
      font-weight: 600;
      font-size: 0.82rem;
      color: #374151;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      margin-bottom: 0.3rem;
    }
    .form-control, .form-select {
      border-radius: 8px;
      padding: 0.65rem 0.9rem;
      border: 1.5px solid #d1d5db;
      font-size: 0.9rem;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .form-control:focus, .form-select:focus {
      border-color: var(--navy);
      box-shadow: 0 0 0 3px rgba(30, 58, 95, 0.12);
    }
    .input-group-text {
      background: #f9fafb;
      border: 1.5px solid #d1d5db;
      border-right: none;
      color: #6b7280;
    }
    .input-group .form-control {
      border-left: none;
    }
    .input-group .form-control:focus {
      border-left: none;
      box-shadow: 0 0 0 3px rgba(30, 58, 95, 0.12);
    }
    .btn-auth {
      background: var(--navy);
      border: none;
      border-radius: 8px;
      padding: 0.72rem 1.5rem;
      font-weight: 700;
      font-size: 0.9rem;
      letter-spacing: 0.3px;
      color: #fff;
      transition: background 0.2s, transform 0.15s;
    }
    .btn-auth:hover {
      background: var(--navy-dark);
      transform: translateY(-1px);
      color: #fff;
    }
    .auth-feature-item {
      display: flex;
      align-items: center;
      gap: 0.9rem;
      margin-bottom: 1.1rem;
    }
    .auth-feature-icon {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      flex-shrink: 0;
    }
    .auth-feature-title {
      color: #fff;
      font-weight: 600;
      font-size: 0.875rem;
      line-height: 1.2;
    }
    .auth-feature-sub {
      color: rgba(255, 255, 255, 0.5);
      font-size: 0.75rem;
    }
    .text-link-orange {
      color: var(--orange);
      font-weight: 600;
      text-decoration: none;
    }
    .text-link-orange:hover { color: #c9661a; text-decoration: underline; }
    @media (max-width: 767px) {
      .auth-panel-left { display: none; }
      .auth-panel-right { padding: 2rem 1.5rem; }
    }
  </style>
  {% block extra_css %}{% endblock %}
</head>
<body>
  {% block content %}{% endblock %}
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  {% block extra_js %}{% endblock %}
</body>
</html>
